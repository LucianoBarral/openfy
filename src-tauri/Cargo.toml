[package]
name = "openfy"
version = "0.1.0"
description = "Openfy - player de musica em Rust baseado em yt-dlp"
edition = "2021"
license = "MIT"
repository = "https://github.com/LucianoBarral/openfy"
readme = "../README.md"

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
ureq = "2"
tauri-plugin-updater = "2"
